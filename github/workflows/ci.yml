name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate landing page files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure required files exist
        run: |
          test -f index.html || (echo "index.html not found" && exit 1)
          test -f styles.css || (echo "styles.css not found" && exit 1)

      - name: Basic structure checks
        run: |
          grep -qi "<nav" index.html || (echo "Missing <nav>" && exit 1)
          grep -qi "id=\"hero\"" index.html || (echo "Missing hero section" && exit 1)
          grep -qi "id=\"features\"" index.html || (echo "Missing features section" && exit 1)
          grep -qi "id=\"stats\"" index.html || (echo "Missing stats section" && exit 1)
          grep -qi "<footer" index.html || (echo "Missing <footer>" && exit 1)
          grep -qi "href=\"styles.css\"" index.html || (echo "styles.css not linked" && exit 1)

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: vxcloud-site
          path: |
            index.html
            styles.css

  docker-smoke:
    name: Docker smoke test (Nginx)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Nginx container
        run: |
          docker run -d --name vxcloud-web -p 8080:80 \
            -v "$PWD/index.html":/usr/share/nginx/html/index.html:ro \
            -v "$PWD/styles.css":/usr/share/nginx/html/styles.css:ro \
            nginx:alpine

      - name: Wait for server and check content
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080 | grep -q "VxCloud" || (echo "Landing page content not found" && exit 1)

      - name: Cleanup
        if: always()
        run: docker rm -f vxcloud-web || true